name: refresh profile activity

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [music_now_playing]

permissions:
  contents: write

concurrency:
  group: refresh-profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20.x"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate profile generator
        run: npm run check

      - name: Refresh books , films , music , and presence
        env:
          MUSIC_EVENT_JSON: ${{ toJson(github.event.client_payload) }}
        run: npm run update-profile

      - name: Commit meaningful changes
        run: |
          if git diff --quiet -- README.md assets/activity data/activity.json; then
            echo "Nothing new in the rotation"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/activity data/activity.json
          git commit -m "chore: refresh profile activity"
          git push
