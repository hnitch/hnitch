name: write Goodreads summaries locally

# The job runs only on hn's private Mac Mini runner. Ollama stays bound to
# localhost , so no hosted model account or remotely exposed inference API is
# involved. Keep this manual until the runner and model have passed a live test.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Local Ollama model
        required: true
        default: gpt-oss:20b
        type: choice
        options:
          - gpt-oss:20b
          - qwen3:8b

permissions:
  contents: write

concurrency:
  group: refresh-profile-activity
  cancel-in-progress: false

jobs:
  summarize:
    # A public fork cannot satisfy these checks. Only hn can dispatch this
    # workflow from the protected default branch in the canonical repository.
    if: >-
      github.repository == 'hnitch/hnitch' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'hnitch' &&
      github.triggering_actor == 'hnitch'
    runs-on: [self-hosted, macOS, ARM64, hnitch-ai]
    environment: local-ai
    timeout-minutes: 25
    env:
      GOODREADS_LOCAL_MODEL: ${{ inputs.model }}
      GOODREADS_LOCAL_MODEL_URL: http://127.0.0.1:11434

    steps:
      - name: Check out profile
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20.x"
          cache: npm

      - name: Install dependencies
        # This repository does not need package lifecycle hooks. Refusing them
        # removes a common self-hosted-runner supply-chain execution path.
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate profile and local-model bridge
        run: npm run check

      - name: Refresh Goodreads before summarizing
        run: npm run update-profile

      - name: Write review-specific reactions on the Mac Mini
        run: npm run reviews:local

      - name: Re-render the profile with validated reactions
        run: npm run update-profile

      - name: Commit meaningful changes
        run: |
          if git diff --quiet -- README.md assets/activity data/activity.json data/review-summaries.json; then
            echo "No new Goodreads reaction to publish"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/activity data/activity.json data/review-summaries.json
          git commit -m "chore: write local Goodreads micro-reviews"
          git push
