<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-labelledby="title desc" text-rendering="geometricPrecision" shape-rendering="geometricPrecision">
  <title id="title">hii , i'm hn</title>
  <desc id="desc">i build things for screens. off-screen , there’s usually a book involved and music playing somewhere.</desc>
