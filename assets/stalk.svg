    <text x="190" y="124" fill="#c6bbd2" font-size="14.5" font-weight="600">on socials , go ahead. everything else? that's <tspan fill="#ff9f9a">red , red</tspan><tspan fill="#8f839d" font-size="9.5" baseline-shift="sub"> (cortis)</tspan></text>

