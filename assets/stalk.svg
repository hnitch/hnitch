<svg xmlns="http://www.w3.org/2000/svg" width="880" height="190" viewBox="0 0 880 190" role="img" aria-labelledby="title desc" text-rendering="geometricPrecision" shape-rendering="geometricPrecision">
  <title id="title">stalk me , but keep it legal</title>
  <desc id="desc">five approved public trails across books , films , music , presence , and photos</desc>
